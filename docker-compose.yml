version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant:v1.9.1
    container_name: biometric_qdrant_engine
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    restart: unless-stopped

  biometric-api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: biometric_fastapi_backend
    ports:
      - "8000:8000"
    environment:
      - QDRANT_URL=http://qdrant:6333
      - BIOMETRIC_APP_SECRET_KEY=b3a7c6f092e48102a9b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5
      - SUPABASE_URL=https://mock.supabase.co
      - SUPABASE_KEY=mock_key
    depends_on:
      - qdrant
    restart: unless-stopped

volumes:
  qdrant_storage:
